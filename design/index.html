<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>梦见 - 首页</title>
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <style>
            .hero-section {
                padding: 20px 24px 40px;
                text-align: center;
                background: radial-gradient(circle at 50% -20%, #f3efff 0%, #ffffff 60%);
                position: relative;
                overflow: hidden;
            }

            /* Decorative Elements */
            .moon-bg {
                position: absolute;
                top: -60px;
                right: -40px;
                width: 200px;
                height: 200px;
                background: radial-gradient(circle, rgba(107, 78, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
                border-radius: 50%;
                z-index: 0;
            }

            .record-btn-container {
                margin: 40px 0;
                display: flex;
                justify-content: center;
                position: relative;
                z-index: 1;
            }

            .record-btn-large {
                width: 130px;
                height: 130px;
                border-radius: 50%;
                background: var(--primary-gradient);
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: var(--shadow-primary);
                border: none;
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                position: relative;
            }

            .record-btn-large::before {
                content: '';
                position: absolute;
                top: -10px;
                left: -10px;
                right: -10px;
                bottom: -10px;
                border-radius: 50%;
                border: 2px solid rgba(107, 78, 255, 0.1);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    transform: scale(0.95);
                    opacity: 0.5;
                }
                50% {
                    transform: scale(1.05);
                    opacity: 0.2;
                }
                100% {
                    transform: scale(0.95);
                    opacity: 0.5;
                }
            }

            .record-btn-large:active {
                transform: scale(0.92);
                box-shadow: 0 4px 10px rgba(107, 78, 255, 0.3);
            }

            .record-icon {
                width: 40px;
                height: 40px;
                margin-bottom: 8px;
                fill: white;
            }

            .review-card {
                background: var(--primary-gradient);
                color: white;
                position: relative;
                overflow: hidden;
                border: none;
            }

            .review-card::after {
                content: '';
                position: absolute;
                top: 0;
                right: 0;
                width: 150px;
                height: 100%;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.1) 100%);
                pointer-events: none;
            }

            .review-card .text-secondary {
                color: rgba(255, 255, 255, 0.9);
            }

            .tag {
                background: rgba(255, 255, 255, 0.25);
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 11px;
                margin-right: 6px;
                backdrop-filter: blur(4px);
                font-weight: 500;
            }

            .welcome-text {
                font-family: 'PingFang SC', serif;
                letter-spacing: 1px;
                position: relative;
                z-index: 1;
            }
        </style>
        <script src="prototype.js"></script>
    </head>
    <body>
        <div class="app-container">
            <!-- Hero Section -->
            <div class="hero-section">
                <div class="moon-bg"></div>

                <h1
                    class="text-xxl welcome-text"
                    id="greeting"
                >
                    你好，梦游者
                </h1>
                <p
                    class="text-secondary text-sm"
                    style="margin-top: 8px"
                >
                    梦境里发生了什么故事？
                </p>

                <div class="record-btn-container">
                    <button
                        class="record-btn-large ripple"
                        onclick="window.location.href = 'record.html'"
                    >
                        <svg
                            class="record-icon"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                            />
                        </svg>
                        <span style="font-weight: 600; font-size: 16px">记梦</span>
                    </button>
                </div>
            </div>

            <section
                class="home-shortcuts"
                aria-label="快速入口"
            >
                <a
                    class="home-shortcut"
                    href="tarot.html"
                >
                    <span class="home-shortcut-icon">✦</span>
                    <span><strong>今日塔罗</strong><small>抽一张指引牌</small></span>
                </a>
                <a
                    class="home-shortcut"
                    href="tests.html"
                >
                    <span class="home-shortcut-icon">◌</span>
                    <span><strong>心理测试</strong><small>MBTI / 大五人格</small></span>
                </a>
                <a
                    class="home-shortcut"
                    href="profile.html"
                >
                    <span class="home-shortcut-icon">▣</span>
                    <span><strong>梦境打卡</strong><small id="home-checkin">连续 7 天，今天待记</small></span>
                </a>
                <a
                    class="home-shortcut"
                    href="discover.html"
                >
                    <span class="home-shortcut-icon">⌕</span>
                    <span><strong>探索广场</strong><small>看看他人的梦</small></span>
                </a>
            </section>

            <!-- Yesterday's Review -->
            <a
                class="card review-card ripple"
                href="dream-detail.html"
                style="display: block; text-decoration: none"
                aria-label="查看最近的梦"
            >
                <div
                    class="flex justify-between items-center"
                    style="margin-bottom: 12px"
                >
                    <h3 class="text-lg font-bold flex items-center gap-xs">
                        <svg
                            viewBox="0 0 24 24"
                            style="width: 18px; height: 18px; fill: white"
                        >
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"
                            />
                        </svg>
                        最近的梦
                    </h3>
                    <span
                        class="text-xs"
                        style="opacity: 0.8"
                        id="recent-date"
                        >2026-10-08</span
                    >
                </div>
                <div
                    class="text-sm"
                    style="margin-bottom: 16px; opacity: 0.95; line-height: 1.6; font-weight: 500"
                >
                    <span id="recent-content">我梦见自己在一片草地上奔跑，天空很蓝……</span>
                </div>
                <div class="flex justify-between items-center">
                    <div
                        class="flex"
                        id="recent-tags"
                    >
                        <span class="tag">飞行</span>
                        <span class="tag">自然</span>
                    </div>
                    <div
                        class="btn-sm"
                        style="
                            background: rgba(255, 255, 255, 0.2);
                            color: white;
                            padding: 6px 14px;
                            border-radius: 20px;
                            font-size: 11px;
                            backdrop-filter: blur(4px);
                        "
                    >
                        查看详情
                    </div>
                </div>
            </a>

            <!-- Task Preview -->
            <div class="card ripple">
                <div
                    class="flex justify-between items-center"
                    style="margin-bottom: 16px"
                >
                    <h3 class="text-lg font-bold text-main">今日改运任务</h3>
                    <span
                        class="text-primary text-xs font-bold bg-primary-light"
                        style="background: #e0d9ff; padding: 4px 8px; border-radius: 4px; color: var(--primary-color)"
                        id="home-task-status"
                        >进行中</span
                    >
                </div>
                <div class="flex items-center gap-md">
                    <div
                        style="
                            width: 48px;
                            height: 48px;
                            background: #fff9c4;
                            border-radius: 12px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 24px;
                        "
                    >
                        🧘
                    </div>
                    <div style="flex: 1">
                        <div
                            class="text-sm font-bold"
                            style="margin-bottom: 4px"
                        >
                            深呼吸三次
                        </div>
                        <div class="text-xs text-secondary">感受自由的空气</div>
                    </div>
                    <button
                        class="btn btn-outline btn-sm"
                        style="padding: 6px 16px; border-radius: 16px"
                        id="home-task"
                    >
                        打卡
                    </button>
                </div>
            </div>

            <!-- Tab Bar -->
            <nav
                class="tabbar"
                aria-label="主导航"
            >
                <a
                    href="index.html"
                    class="tab-item active"
                    aria-current="page"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                    <span>首页</span>
                </a>
                <a
                    href="discover.html"
                    class="tab-item"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <span>发现</span>
                </a>
                <a
                    href="record.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                        />
                    </svg>
                    <span>记梦</span>
                </a>
                <a
                    href="profile.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                        />
                    </svg>
                    <span>我的</span>
                </a>
            </nav>
        </div>
        <script>
            const now = new Date();
            const hour = Number(
                new Intl.DateTimeFormat('zh-CN', {
                    timeZone: 'Asia/Shanghai',
                    hour: 'numeric',
                    hourCycle: 'h23'
                }).format(now)
            );
            document.getElementById('greeting').textContent =
                `${hour < 6 ? '夜深了' : hour < 12 ? '早上好' : hour < 18 ? '下午好' : '晚上好'}，梦游者`;
            document.getElementById('recent-date').textContent = DrimDesign.shanghaiDate(Date.now() - 86400000);
            const dream = DrimDesign.readDream();
            if (dream) {
                const recentTags = document.getElementById('recent-tags');
                recentTags.replaceChildren();
                dream.tags.forEach((tag) => {
                    const badge = document.createElement('span');
                    badge.className = 'tag';
                    badge.textContent = DrimDesign.labelTag(tag);
                    recentTags.append(badge);
                });
                document.getElementById('recent-content').textContent =
                    dream.content.length > 60 ? dream.content.slice(0, 60) + '……' : dream.content;
                if (dream.recordedAt && !Number.isNaN(Date.parse(dream.recordedAt)))
                    document.getElementById('recent-date').textContent = new Intl.DateTimeFormat('sv-SE', {
                        timeZone: 'Asia/Shanghai'
                    }).format(new Date(dream.recordedAt));
                if (dream.recordedAt && DrimDesign.shanghaiDate(dream.recordedAt) === DrimDesign.shanghaiDate())
                    document.getElementById('home-checkin').textContent = '连续 8 天，今天已记';
            }
            const task = document.getElementById('home-task');
            let done = false;
            try {
                done = sessionStorage.getItem('drim-design-task') === DrimDesign.shanghaiDate();
            } catch {}
            if (done) {
                task.textContent = '已完成';
                task.disabled = true;
                document.getElementById('home-task-status').textContent = '已完成';
            }
            task.addEventListener('click', () => {
                try {
                    sessionStorage.setItem('drim-design-task', DrimDesign.shanghaiDate());
                } catch {}
                location.href = 'task-complete.html';
            });
        </script>
    </body>
</html>
