<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>梦见 - 记录梦境</title>
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <style>
            .record-page {
                padding-bottom: calc(var(--record-actions-height, 80px) + var(--record-tab-height, 70px) + 32px);
            }
            .record-page [hidden] {
                display: none !important;
            }
            .record-page .navbar .btn-icon {
                position: absolute;
                left: 10px;
            }
            .record-page .navbar .icon-svg {
                fill: currentColor;
            }
            .edit-state {
                position: absolute;
                right: 16px;
                color: var(--text-secondary);
                font-size: 11px;
                font-weight: 400;
            }
            .input-card {
                padding: 16px;
                margin: 16px;
                background: var(--card-background);
                border-radius: var(--radius-lg);
            }
            .editor-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .editor-heading label {
                color: var(--text-secondary);
                font-size: 12px;
                font-weight: 500;
            }
            .dream-input {
                display: block;
                width: 100%;
                min-height: 176px;
                padding: 16px 0;
                resize: none;
                overflow: hidden;
                border: 0;
                background: transparent;
                color: var(--text-main);
                font: inherit;
                font-size: 16px;
                line-height: 1.85;
            }
            .dream-input::placeholder {
                color: var(--text-light);
            }
            .input-footer,
            .section-heading {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                align-items: baseline;
            }
            .input-footer {
                padding-top: 10px;
                border-top: 1px solid var(--border-color);
                color: var(--text-secondary);
                font-size: 11px;
            }
            .char-count {
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }
            #polishButton {
                margin-top: 12px;
                min-height: 32px;
            }
            .text-button {
                min-height: 36px;
                border: 0;
                background: transparent;
                color: var(--primary-color);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
            .polish-preview {
                margin-top: 12px;
                padding: 14px;
                background: var(--background-color);
                border-radius: 12px;
            }
            .polish-preview h2 {
                font-size: 13px;
            }
            .preview-content {
                margin: 12px 0;
                font-size: 14px;
                line-height: 1.85;
                white-space: pre-wrap;
            }
            .element-section {
                margin: 12px 16px;
            }
            .section-heading {
                margin-bottom: 10px;
            }
            .section-heading .text-button {
                min-height: 28px;
            }
            .section-heading h2 {
                font-size: 14px;
            }
            .tag-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }
            .tag-button {
                min-width: 0;
                min-height: 42px;
                padding: 8px 4px;
                border: 1px solid var(--border-color);
                border-radius: 12px;
                background: var(--card-background);
                color: var(--text-secondary);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
            }
            .tag-button[aria-pressed='true'] {
                color: var(--primary-color);
                background: var(--primary-light);
                border-color: var(--primary-color);
                font-weight: 700;
            }
            .record-meta {
                display: grid;
                grid-template-columns: 1.15fr 1fr;
                gap: 8px;
                margin: 16px;
            }
            .record-meta select {
                width: 100%;
                min-width: 0;
                min-height: 42px;
                padding: 10px;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                background: var(--card-background);
                color: var(--text-main);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
            }
            .input-card {
                margin-bottom: 12px;
            }
            .setting-hint {
                margin-top: 8px;
                color: var(--text-secondary);
                font-size: 11px;
                line-height: 1.6;
            }
            .setting-hint[data-error='true'] {
                color: var(--error-color);
            }
            .setting-actions {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
            .setting-actions .btn {
                font-size: 12px;
                padding: 8px 12px;
                text-decoration: none;
            }
            .version-select,
            .custom-tag-input {
                min-width: 0;
                width: 100%;
                padding: 10px;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                background: var(--card-background);
                color: var(--text-main);
                font: inherit;
                font-size: 12px;
            }
            .version-select {
                width: auto;
                max-width: 150px;
                padding: 6px 8px;
                border: 0;
                background: var(--background-color);
            }
            .custom-tag-editor {
                margin-top: 12px;
            }
            .custom-tag-input {
                flex: 1;
            }
            .custom-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 8px;
            }
            .custom-tags:empty {
                display: none;
            }
            .custom-tags .tag-button {
                padding: 6px 10px;
                min-height: 34px;
            }
            .record-status {
                margin-bottom: 10px;
                color: var(--primary-color);
                font-size: 12px;
                line-height: 1.6;
            }
            .record-status:empty {
                display: none;
            }
            .record-actions {
                position: fixed;
                z-index: 90;
                left: 50%;
                bottom: var(--record-actions-bottom, calc(70px + var(--safe-area-bottom)));
                width: 100%;
                max-width: 420px;
                transform: translateX(-50%);
                padding: 12px 16px;
                background: var(--card-background);
                border-top: 1px solid var(--border-color);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
            }
            .record-actions .btn {
                min-height: 46px;
            }
            .action-buttons {
                display: grid;
                grid-template-columns: 0.8fr 1.3fr;
                gap: 8px;
            }
            .record-actions .btn {
                padding: 10px 8px;
                white-space: nowrap;
                font-size: 13px;
            }
            .record-actions .btn-primary {
                background: var(--primary-color);
                box-shadow: none;
            }
            .record-actions .btn-outline {
                border-color: var(--border-color);
                color: var(--text-main);
            }
            .keyboard-open .tabbar {
                visibility: hidden;
            }
            .leave-dialog {
                width: calc(100% - 40px);
                max-width: 360px;
                max-height: calc(100dvh - 40px);
                margin: auto;
                padding: 24px;
                border: 0;
                border-radius: 20px;
                background: var(--card-background);
                color: var(--text-main);
            }
            .leave-dialog::backdrop {
                background: rgba(25, 22, 40, 0.45);
            }
            .leave-dialog h2 {
                font-size: 18px;
            }
            .leave-dialog p {
                margin: 10px 0 20px;
                color: var(--text-secondary);
                font-size: 13px;
                line-height: 1.7;
            }
            .leave-dialog .btn {
                width: 100%;
                min-height: 44px;
            }
            .leave-dialog .text-button {
                display: flex;
                width: 100%;
                justify-content: center;
                margin-top: 8px;
                color: var(--text-secondary);
            }
            .record-page button:disabled {
                cursor: not-allowed;
                opacity: 0.45;
                box-shadow: none;
            }
            .record-page :is(button, input, textarea, select, summary, a):focus-visible {
                outline: 3px solid var(--primary-color);
                outline-offset: 3px;
            }
            .record-page :is(input, textarea, select, summary, button) {
                scroll-margin-bottom: 175px;
            }
            @media (max-width: 340px) {
                .input-card,
                .record-meta,
                .element-section {
                    margin-left: 12px;
                    margin-right: 12px;
                }
                .record-actions .btn {
                    font-size: 12px;
                }
            }
        </style>
        <script src="prototype.js"></script>
    </head>
    <body>
        <div class="app-container record-page">
            <div class="navbar">
                <button
                    id="backButton"
                    class="btn-icon"
                    type="button"
                    aria-label="返回首页"
                    data-leave="index.html"
                >
                    <svg
                        class="icon-svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>
                <span id="pageTitle">记录梦境</span>
                <span
                    id="editState"
                    class="edit-state"
                    aria-live="polite"
                    >尚未填写</span
                >
            </div>
            <main>
                <section
                    class="input-card"
                    aria-labelledby="dreamInputLabel"
                >
                    <div class="editor-heading">
                        <label
                            id="dreamInputLabel"
                            class="text-sm font-bold"
                            for="dreamContent"
                            >梦境内容</label
                        >
                        <select
                            id="versionSelect"
                            class="version-select"
                            aria-label="正在编辑的版本"
                        >
                            <option value="original">v1 原始记录</option>
                            <option
                                id="polishedOption"
                                value="polished"
                                disabled
                            >
                                v2 润色示例
                            </option>
                        </select>
                    </div>
                    <textarea
                        id="dreamContent"
                        class="dream-input"
                        maxlength="1000"
                        aria-describedby="inputHint"
                        placeholder="我梦见……&#10;&#10;在哪里，遇见了谁？&#10;发生了什么，醒来时是什么感觉？"
                    ></textarea>
                    <div class="input-footer">
                        <span id="inputHint">至少 25 字，记得多少就先写多少</span
                        ><span
                            id="charCount"
                            class="char-count"
                            >0/1000</span
                        >
                    </div>
                    <button
                        id="polishButton"
                        class="text-button"
                        type="button"
                        disabled
                    >
                        预览润色示例
                    </button>
                    <section
                        id="polishPreview"
                        class="polish-preview"
                        aria-labelledby="polishPreviewTitle"
                        hidden
                    >
                        <h2 id="polishPreviewTitle">润色示例预览</h2>
                        <p
                            id="polishPreviewHint"
                            class="setting-hint"
                        >
                            演示用草地飞行的故事，未根据你的文字生成。应用后仍可切回原始记录。
                        </p>
                        <p
                            id="polishPreviewContent"
                            class="preview-content"
                        ></p>
                        <div class="setting-actions">
                            <button
                                id="applyPolish"
                                class="btn btn-primary btn-sm"
                                type="button"
                            >
                                应用到润色版本
                            </button>
                            <button
                                id="cancelPolish"
                                class="text-button"
                                type="button"
                            >
                                继续编辑
                            </button>
                        </div>
                    </section>
                </section>
                <section
                    class="element-section"
                    aria-labelledby="tagHeading"
                >
                    <div class="section-heading">
                        <h2 id="tagHeading">梦里出现了什么</h2>
                        <button
                            id="customTagToggle"
                            class="text-button"
                            type="button"
                            aria-expanded="false"
                            aria-controls="customTagEditor"
                        >
                            ＋ 自定义
                        </button>
                    </div>
                    <div
                        id="tagGrid"
                        class="tag-grid"
                    ></div>
                    <div
                        id="customTags"
                        class="custom-tags"
                    ></div>
                    <div
                        id="customTagEditor"
                        class="custom-tag-editor"
                        hidden
                    >
                        <label
                            class="setting-label"
                            for="customTagInput"
                            >添加一个梦境元素</label
                        >
                        <div class="setting-actions">
                            <input
                                id="customTagInput"
                                class="custom-tag-input"
                                maxlength="12"
                                placeholder="例如：童年，最多 12 字"
                            />
                            <button
                                id="addTagButton"
                                class="btn btn-outline btn-sm"
                                type="button"
                            >
                                添加
                            </button>
                        </div>
                    </div>
                    <p
                        id="tagHint"
                        class="setting-hint"
                        role="status"
                        aria-live="polite"
                    >
                        已选 0 / 最多 3 个
                    </p>
                </section>
                <div class="record-meta">
                    <select
                        id="privacySelect"
                        aria-label="梦境隐私"
                    >
                        <option value="private">🔒 仅自己可见</option>
                        <option value="public">🌍 探索广场可见</option>
                    </select>
                    <select
                        id="emotionSelect"
                        aria-label="梦中情绪"
                    >
                        <option value="">情绪（可选）</option>
                    </select>
                </div>
            </main>
            <div
                id="recordActions"
                class="record-actions"
            >
                <p
                    id="recordStatus"
                    class="record-status"
                    role="status"
                    aria-live="polite"
                ></p>
                <div class="action-buttons">
                    <button
                        id="saveButton"
                        class="btn btn-outline"
                        type="button"
                        disabled
                    >
                        仅保存</button
                    ><button
                        id="parseButton"
                        class="btn btn-primary btn-block"
                        type="button"
                        disabled
                    >
                        保存并解析
                    </button>
                </div>
            </div>
            <nav
                class="tabbar"
                aria-label="主导航"
            >
                <a
                    href="index.html"
                    data-leave="index.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                    <span>首页</span>
                </a>
                <a
                    href="discover.html"
                    data-leave="discover.html"
                    class="tab-item"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <span>发现</span>
                </a>
                <a
                    href="record.html"
                    class="tab-item active"
                    aria-current="page"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                        />
                    </svg>
                    <span>记梦</span>
                </a>
                <a
                    href="profile.html"
                    data-leave="profile.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                        />
                    </svg>
                    <span>我的</span>
                </a>
            </nav>
            <dialog
                id="leaveDialog"
                class="leave-dialog"
                aria-labelledby="leaveTitle"
                aria-describedby="leaveDescription"
            >
                <h2 id="leaveTitle">这场梦还没保存</h2>
                <p id="leaveDescription">离开后，刚才的文字和设置会丢失。可以继续编辑，再点击“仅保存”。</p>
                <button
                    id="keepEditing"
                    class="btn btn-primary"
                    type="button"
                    autofocus
                >
                    继续编辑
                </button>
                <button
                    id="discardChanges"
                    class="text-button"
                    type="button"
                >
                    放弃修改并离开
                </button>
            </dialog>
        </div>
        <script>
            (() => {
                const STORAGE_KEY = 'drim-design-dream';
                const isEditMode = new URLSearchParams(window.location.search).get('edit') === '1';
                const commonTags = [
                    ['running', '追逐'],
                    ['flying', '飞行'],
                    ['exam', '考试'],
                    ['family', '亲人'],
                    ['water', '水'],
                    ['animal', '动物'],
                    ['lost', '迷路'],
                    ['death', '死亡']
                ];
                const emotions = [
                    ['happy', '开心', '😊'],
                    ['sad', '悲伤', '😢'],
                    ['angry', '愤怒', '😡'],
                    ['fear', '恐惧', '😨'],
                    ['surprise', '惊讶', '😮'],
                    ['disgust', '厌恶', '🤢'],
                    ['calm', '平静', '😌'],
                    ['anxious', '焦虑', '😰'],
                    ['confused', '困惑', '😕'],
                    ['excited', '兴奋', '🤩'],
                    ['lonely', '孤独', '😔'],
                    ['shame', '羞愧', '😳'],
                    ['love', '温暖', '🥰'],
                    ['bored', '无聊', '😑']
                ];
                // shortcut: 润色使用固定示例，接入真实 AI 时替换预览来源。
                const sample =
                    '我梦见自己在一片草地上奔跑，阳光落在肩上。后来我慢慢飞起来，俯瞰着安静的大地，心里感到自由又轻松。';
                const content = document.getElementById('dreamContent');
                const parseButton = document.getElementById('parseButton');
                const saveButton = document.getElementById('saveButton');
                const status = document.getElementById('recordStatus');
                const versionSelect = document.getElementById('versionSelect');
                const polishButton = document.getElementById('polishButton');
                const polishPreview = document.getElementById('polishPreview');
                const leaveDialog = document.getElementById('leaveDialog');
                const tagHint = document.getElementById('tagHint');
                const customInput = document.getElementById('customTagInput');
                const privacySelect = document.getElementById('privacySelect');
                const emotionSelect = document.getElementById('emotionSelect');
                const selectedTags = new Set();
                const customTags = new Set();
                const versions = { original: '', polished: '' };
                let activeVersion = 'original';
                let selectedEmotion = '';
                let recordedAt = new Date().toISOString();
                let savedSnapshot = '';
                let pendingHref = '';
                let allowLeave = false;
                let editMissing = false;
                let hasSavedRecord = false;
                const canSubmit = (value) => value.trim().length >= 25 && value.length <= 1000;
                const canAddTag = (value) => selectedTags.has(value) || selectedTags.size < 3;
                const snapshot = () =>
                    JSON.stringify({
                        versions: { ...versions, [activeVersion]: content.value },
                        activeVersion,
                        tags: [...selectedTags].sort(),
                        emotion: selectedEmotion,
                        isPublic: privacySelect.value === 'public'
                    });
                const isDirty = () => savedSnapshot !== '' && savedSnapshot !== snapshot();
                const updateEditState = () => {
                    document.getElementById('editState').textContent = isDirty()
                        ? '未保存'
                        : editMissing
                          ? '未找到记录'
                          : hasSavedRecord
                            ? '已保存'
                            : '尚未填写';
                };
                const setStatus = (message) => {
                    status.textContent = message;
                    fitActions();
                };
                const tagError = (message) => {
                    tagHint.textContent = message;
                    tagHint.dataset.error = 'true';
                };
                const resizeInput = () => {
                    content.style.height = 'auto';
                    content.style.height = `${Math.max(176, content.scrollHeight)}px`;
                };

                const updateCount = () => {
                    if (content.value.length > 1000) content.value = content.value.slice(0, 1000);
                    document.getElementById('charCount').textContent = `${content.value.length}/1000`;
                    const remaining = Math.max(0, 25 - content.value.trim().length);
                    document.getElementById('inputHint').textContent = !content.value.trim()
                        ? '至少 25 字，记得多少就先写多少'
                        : remaining
                          ? `再写 ${remaining} 字即可保存`
                          : '已可保存，最多 1000 字';
                    parseButton.disabled = saveButton.disabled = !canSubmit(content.value);
                    polishButton.disabled = document.getElementById('applyPolish').disabled = !canSubmit(content.value);
                    versions[activeVersion] = content.value;
                    document.getElementById('polishedOption').disabled = !versions.polished.trim();
                    resizeInput();
                    updateEditState();
                };
                const updateSelections = () => {
                    document
                        .querySelectorAll('[data-tag]')
                        .forEach((button) =>
                            button.setAttribute('aria-pressed', String(selectedTags.has(button.dataset.tag)))
                        );
                    tagHint.textContent = `已选 ${selectedTags.size} / 最多 3 个`;
                    tagHint.dataset.error = 'false';
                    updateEditState();
                };
                const toggleTag = (tag) => {
                    if (selectedTags.has(tag)) selectedTags.delete(tag);
                    else if (canAddTag(tag)) selectedTags.add(tag);
                    else {
                        tagError('最多选择 3 个标签，请先取消一个。');
                        return;
                    }
                    setStatus('');
                    updateSelections();
                };
                const makeTagButton = (tag, label) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'tag-button';
                    button.dataset.tag = tag;
                    button.append(document.createTextNode(label));
                    button.addEventListener('click', () => toggleTag(tag));
                    return button;
                };
                const addCustomTag = (tag) => {
                    if (customTags.has(tag) || commonTags.some(([id, name]) => id === tag || name === tag)) return;
                    customTags.add(tag);
                    document.getElementById('customTags').append(makeTagButton(tag, tag));
                };
                const saveDraft = () => {
                    try {
                        window.sessionStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify({
                                content: content.value,
                                tags: [...selectedTags],
                                emotion: selectedEmotion || null,
                                isPublic: privacySelect.value === 'public',
                                recordedAt,
                                versions: { ...versions, [activeVersion]: content.value },
                                activeVersion
                            })
                        );
                        editMissing = false;
                        hasSavedRecord = true;
                        savedSnapshot = snapshot();
                        updateEditState();
                        return true;
                    } catch (_) {
                        return false;
                    }
                };
                const readDraft = () => {
                    try {
                        return JSON.parse(window.sessionStorage.getItem(STORAGE_KEY));
                    } catch (_) {
                        return null;
                    }
                };
                const draft = isEditMode ? readDraft() : null;
                if (draft && !Array.isArray(draft) && typeof draft.content === 'string' && draft.content.trim()) {
                    hasSavedRecord = true;
                    content.value = draft.content.slice(0, 1000);
                    versions.original = content.value;
                    if (draft.versions && typeof draft.versions === 'object') {
                        for (const name of ['original', 'polished']) {
                            if (typeof draft.versions[name] === 'string')
                                versions[name] = draft.versions[name].slice(0, 1000);
                        }
                        if (draft.activeVersion === 'original' || draft.activeVersion === 'polished') {
                            activeVersion = versionSelect.value = draft.activeVersion;
                            if (!versions[activeVersion].trim()) versions[activeVersion] = content.value;
                            content.value = versions[activeVersion];
                        }
                    }
                    if (typeof draft.recordedAt === 'string' && !Number.isNaN(Date.parse(draft.recordedAt)))
                        recordedAt = new Date(draft.recordedAt).toISOString();
                    if (Array.isArray(draft.tags))
                        draft.tags
                            .filter((tag) => typeof tag === 'string' && tag.length > 0)
                            .slice(0, 3)
                            .forEach((tag) => {
                                const known = commonTags.find(([id, name]) => tag === id || tag === name);
                                const value = known ? known[0] : tag.slice(0, 12);
                                selectedTags.add(value);
                                if (!known) addCustomTag(value);
                            });
                    if (emotions.some(([id]) => id === draft.emotion)) selectedEmotion = draft.emotion;
                    privacySelect.value = draft.isPublic === true ? 'public' : 'private';
                }
                if (isEditMode && !content.value) editMissing = true;
                commonTags.forEach(([id, name]) => document.getElementById('tagGrid').append(makeTagButton(id, name)));
                emotions.forEach(([id, name, icon]) => {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = `${icon} ${name}`;
                    emotionSelect.append(option);
                });
                emotionSelect.value = selectedEmotion;
                content.addEventListener('input', () => {
                    updateCount();
                    setStatus('');
                });
                document.getElementById('customTagToggle').addEventListener('click', () => {
                    const editor = document.getElementById('customTagEditor');
                    editor.hidden = !editor.hidden;
                    document.getElementById('customTagToggle').setAttribute('aria-expanded', String(!editor.hidden));
                    if (!editor.hidden) customInput.focus();
                });
                privacySelect.addEventListener('change', updateEditState);
                emotionSelect.addEventListener('change', () => {
                    selectedEmotion = emotionSelect.value;
                    updateEditState();
                });
                document.getElementById('addTagButton').addEventListener('click', () => {
                    const tag = customInput.value.trim();
                    if (!tag) {
                        tagError('请先输入标签。');
                        customInput.focus();
                        return;
                    }
                    const known = commonTags.find(([id, name]) => tag === id || tag === name);
                    const value = known ? known[0] : tag;
                    if (!canAddTag(value)) {
                        tagError('最多选择 3 个标签，请先取消一个。');
                        return;
                    }
                    if (!known) addCustomTag(value);
                    selectedTags.add(value);
                    customInput.value = '';
                    setStatus('');
                    updateSelections();
                });
                customInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) {
                        event.preventDefault();
                        document.getElementById('addTagButton').click();
                    }
                });
                polishButton.addEventListener('click', () => {
                    document.getElementById('polishPreviewContent').textContent = versions.polished || sample;
                    document.getElementById('polishPreviewHint').textContent = versions.polished
                        ? '这是已保留的润色版本。应用后可继续编辑，也可以切回原始记录。'
                        : '演示用草地飞行的故事，未根据你的文字生成。应用后仍可切回原始记录。';
                    polishPreview.hidden = false;
                    polishPreview.scrollIntoView({ block: 'nearest' });
                });
                document.getElementById('cancelPolish').addEventListener('click', () => {
                    polishPreview.hidden = true;
                    polishButton.focus();
                });
                document.getElementById('applyPolish').addEventListener('click', () => {
                    if (!canSubmit(content.value)) return;
                    versions[activeVersion] = content.value;
                    versions.polished = versions.polished || sample;
                    activeVersion = versionSelect.value = 'polished';
                    content.value = versions.polished;
                    polishPreview.hidden = true;
                    updateCount();
                    setStatus('已切到润色版；原始记录仍保留在 v1。');
                    content.focus();
                });
                versionSelect.addEventListener('change', () => {
                    if (
                        !['original', 'polished'].includes(versionSelect.value) ||
                        (versionSelect.value === 'polished' && !versions.polished.trim())
                    ) {
                        versionSelect.value = activeVersion;
                        return;
                    }
                    versions[activeVersion] = content.value;
                    activeVersion = versionSelect.value;
                    content.value = versions[activeVersion];
                    polishPreview.hidden = true;
                    updateCount();
                    setStatus('');
                    content.focus();
                });
                parseButton.addEventListener('click', () => {
                    if (!canSubmit(content.value)) return;
                    if (saveDraft()) window.location.href = 'result.html';
                    else setStatus('浏览器未允许临时保存，无法进入解析结果；内容仍保留在当前页面。');
                });
                saveButton.addEventListener('click', () => {
                    if (!canSubmit(content.value)) return;
                    if (saveDraft()) window.location.href = 'dream-detail.html';
                    else setStatus('浏览器未允许临时保存，内容仍保留在当前页面。');
                });
                if (isEditMode) {
                    document.getElementById('pageTitle').textContent = '编辑梦境';
                    parseButton.textContent = '保存并重新解析';
                }
                document.querySelectorAll('[data-leave]').forEach((link) => {
                    link.addEventListener('click', (event) => {
                        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
                        event.preventDefault();
                        if (!isDirty()) {
                            window.location.href = link.dataset.leave;
                            return;
                        }
                        pendingHref = link.dataset.leave;
                        leaveDialog.showModal();
                    });
                });
                document
                    .querySelector('[aria-current="page"]')
                    .addEventListener('click', (event) => event.preventDefault());
                document.getElementById('keepEditing').addEventListener('click', () => leaveDialog.close());
                document.getElementById('discardChanges').addEventListener('click', () => {
                    allowLeave = true;
                    leaveDialog.close();
                    window.location.href = pendingHref;
                });
                window.addEventListener('beforeunload', (event) => {
                    if (!allowLeave && isDirty()) {
                        event.preventDefault();
                        event.returnValue = '';
                    }
                });
                function fitActions() {
                    const page = document.querySelector('.record-page');
                    const tabHeight = document.querySelector('.tabbar').getBoundingClientRect().height;
                    const viewport = window.visualViewport;
                    const inset = viewport ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) : 0;
                    const keyboardOpen = inset > 150 && /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
                    page.classList.toggle('keyboard-open', keyboardOpen);
                    page.style.setProperty('--record-tab-height', `${tabHeight}px`);
                    page.style.setProperty('--record-actions-bottom', `${keyboardOpen ? inset : tabHeight}px`);
                    page.style.setProperty(
                        '--record-actions-height',
                        `${document.getElementById('recordActions').getBoundingClientRect().height}px`
                    );
                }
                window.addEventListener('resize', () => {
                    resizeInput();
                    fitActions();
                });
                window.visualViewport?.addEventListener('resize', fitActions);
                window.visualViewport?.addEventListener('scroll', fitActions);
                updateCount();
                updateSelections();
                savedSnapshot = snapshot();
                updateEditState();
                fitActions();
                if (editMissing) setStatus('未找到可编辑的记录，请先输入一场新梦。');

                if (new URLSearchParams(window.location.search).has('selfcheck')) {
                    console.assert(
                        !canSubmit('梦'.repeat(24)) &&
                            canSubmit('梦'.repeat(25)) &&
                            canSubmit('梦'.repeat(1000)) &&
                            !canSubmit('梦'.repeat(1001)),
                        '内容字数边界'
                    );
                    console.assert(!canSubmit(' '.repeat(25)), '空白内容不可解析');
                    const before = [...selectedTags];
                    selectedTags.clear();
                    ['one', 'two', 'three'].forEach((tag) => selectedTags.add(tag));
                    console.assert(!canAddTag('four') && canAddTag('one'), '最多三个标签且允许取消已选标签');
                    selectedTags.clear();
                    before.forEach((tag) => selectedTags.add(tag));
                    updateSelections();
                }
            })();
        </script>
    </body>
</html>
