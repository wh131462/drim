<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>今日塔罗 - 梦见</title>
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <style>
            .page-header {
                padding: 34px 20px 28px;
                color: white;
                background: var(--primary-gradient);
                border-radius: 0 0 28px 28px;
            }
            .page-header p {
                margin-top: 6px;
                opacity: 0.82;
            }
            .back-link {
                color: rgba(255, 255, 255, 0.82);
                text-decoration: none;
                font-size: 13px;
                display: inline-flex;
                gap: 5px;
                align-items: center;
                margin-bottom: 22px;
            }
            .mode-switch {
                display: flex;
                gap: 8px;
                margin: 20px 16px 4px;
                padding: 4px;
                background: #edeaff;
                border-radius: 16px;
            }
            .mode-switch button {
                flex: 1;
                border: 0;
                border-radius: 12px;
                padding: 10px 8px;
                background: transparent;
                color: var(--text-secondary);
                font-size: 13px;
                cursor: pointer;
            }
            .mode-switch button.active {
                background: white;
                color: var(--primary-color);
                box-shadow: var(--shadow-sm);
                font-weight: 700;
            }
            .section-copy {
                padding: 18px 20px 4px;
            }
            .section-copy p {
                color: var(--text-secondary);
                font-size: 13px;
                margin-top: 4px;
            }
            .draw-area {
                display: flex;
                justify-content: center;
                gap: 12px;
                padding: 20px 16px 14px;
            }
            .tarot-card {
                width: 120px;
                height: 188px;
                perspective: 900px;
                cursor: pointer;
                border: 0;
                padding: 0;
                background: transparent;
                text-align: initial;
            }
            .tarot-card-inner {
                position: relative;
                width: 100%;
                height: 100%;
                transition: transform 0.65s cubic-bezier(0.2, 0.75, 0.25, 1);
                transform-style: preserve-3d;
            }
            .tarot-card.flipped .tarot-card-inner {
                transform: rotateY(180deg);
            }
            .tarot-face {
                position: absolute;
                inset: 0;
                border-radius: 16px;
                backface-visibility: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 12px;
                text-align: center;
                box-shadow: 0 12px 24px rgba(76, 58, 170, 0.18);
            }
            .tarot-back {
                color: #fff;
                background: radial-gradient(circle at 50% 40%, #a68cff, #4d38c5 72%);
                border: 1px solid rgba(255, 255, 255, 0.38);
            }
            .tarot-back .moon {
                font-size: 40px;
                line-height: 1;
                margin-bottom: 12px;
            }
            .tarot-back small {
                font-size: 10px;
                letter-spacing: 2px;
                opacity: 0.78;
            }
            .tarot-front {
                background: linear-gradient(155deg, #fff 0%, #f1edff 100%);
                color: var(--text-main);
                transform: rotateY(180deg);
                border: 1px solid #e6e0ff;
            }
            .tarot-front .symbol {
                font-size: 38px;
                margin-bottom: 8px;
            }
            .tarot-front strong {
                color: var(--primary-color);
                font-size: 14px;
            }
            .tarot-front span {
                color: var(--text-secondary);
                font-size: 11px;
                margin-top: 5px;
            }
            .draw-hint {
                text-align: center;
                color: var(--text-light);
                font-size: 12px;
            }
            .reading {
                margin: 16px;
                padding: 18px;
                background: white;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                border-left: 3px solid var(--primary-color);
            }
            .reading-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 9px;
            }
            .reading-head span {
                color: var(--primary-color);
                font-size: 11px;
                background: var(--primary-light);
                border-radius: 99px;
                padding: 4px 8px;
            }
            .reading p {
                color: var(--text-secondary);
                line-height: 1.7;
                font-size: 13px;
            }
            .three-card .tarot-card {
                width: 96px;
                height: 150px;
            }
            .three-card .tarot-back .moon {
                font-size: 30px;
                margin-bottom: 8px;
            }
            .position {
                font-size: 11px;
                color: var(--text-light);
                text-align: center;
                margin-top: -8px;
            }
            .hidden {
                display: none !important;
            }
            @media (max-width: 340px) {
                .three-card {
                    gap: 6px;
                    padding-left: 8px;
                    padding-right: 8px;
                }
                .three-card .tarot-card {
                    width: 88px;
                    height: 144px;
                }
            }
        </style>
        <script src="prototype.js"></script>
    </head>
    <body>
        <div class="app-container">
            <header class="page-header">
                <a
                    class="back-link"
                    href="discover.html"
                    >‹ 返回发现</a
                >
                <h1 class="text-xxl">今日塔罗</h1>
                <p class="text-sm">抽一张牌，给今天一个温柔的提醒</p>
            </header>

            <div
                class="mode-switch"
                role="tablist"
                aria-label="塔罗牌阵"
            >
                <button
                    class="active"
                    data-mode="daily"
                    role="tab"
                    aria-selected="true"
                >
                    每日一牌
                </button>
                <button
                    data-mode="three"
                    role="tab"
                    aria-selected="false"
                >
                    三牌阵
                </button>
            </div>

            <section id="daily-mode">
                <div class="section-copy">
                    <h2 class="text-lg">给今天的自己</h2>
                    <p>静下心来，点击牌面翻牌</p>
                </div>
                <div class="draw-area">
                    <button
                        class="tarot-card"
                        type="button"
                        data-card
                        aria-label="翻开每日塔罗牌"
                        aria-pressed="false"
                    >
                        <div class="tarot-card-inner">
                            <div class="tarot-face tarot-back">
                                <div class="moon">☾</div>
                                <small>YOUR CARD</small>
                            </div>
                            <div class="tarot-face tarot-front">
                                <div class="symbol">☀️</div>
                                <strong>太阳</strong><span>正位：充满能量</span>
                            </div>
                        </div>
                    </button>
                </div>
                <div class="draw-hint">点击翻牌查看牌面</div>
                <article
                    class="reading hidden"
                    id="daily-reading"
                >
                    <div class="reading-head"><strong>今日启示</strong><span>积极、清晰</span></div>
                    <p>
                        太阳牌提醒你，把注意力放回真实的快乐。今天适合主动表达、完成一件期待已久的小事，让内在的光被看见。
                    </p>
                </article>
            </section>

            <section
                id="three-mode"
                class="hidden"
            >
                <div class="section-copy">
                    <h2 class="text-lg">过去 → 现在 → 未来</h2>
                    <p>带着一个问题，依次翻开三张牌</p>
                </div>
                <div class="draw-area three-card">
                    <div>
                        <button
                            class="tarot-card"
                            type="button"
                            data-card
                            aria-label="翻开过去的牌"
                            aria-pressed="false"
                        >
                            <div class="tarot-card-inner">
                                <div class="tarot-face tarot-back">
                                    <div class="moon">☾</div>
                                    <small>PAST</small>
                                </div>
                                <div class="tarot-face tarot-front">
                                    <div class="symbol">🌙</div>
                                    <strong>月亮</strong><span>直觉</span>
                                </div>
                            </div>
                        </button>
                        <div class="position">过去</div>
                    </div>
                    <div>
                        <button
                            class="tarot-card"
                            type="button"
                            data-card
                            aria-label="翻开现在的牌"
                            aria-pressed="false"
                        >
                            <div class="tarot-card-inner">
                                <div class="tarot-face tarot-back">
                                    <div class="moon">☾</div>
                                    <small>PRESENT</small>
                                </div>
                                <div class="tarot-face tarot-front">
                                    <div class="symbol">🪄</div>
                                    <strong>魔术师</strong><span>行动</span>
                                </div>
                            </div>
                        </button>
                        <div class="position">现在</div>
                    </div>
                    <div>
                        <button
                            class="tarot-card"
                            type="button"
                            data-card
                            aria-label="翻开未来的牌"
                            aria-pressed="false"
                        >
                            <div class="tarot-card-inner">
                                <div class="tarot-face tarot-back">
                                    <div class="moon">☾</div>
                                    <small>FUTURE</small>
                                </div>
                                <div class="tarot-face tarot-front">
                                    <div class="symbol">⭐</div>
                                    <strong>星星</strong><span>希望</span>
                                </div>
                            </div>
                        </button>
                        <div class="position">未来</div>
                    </div>
                </div>
                <div class="draw-hint">依次点击三张牌，拼出你的故事</div>
                <article
                    class="reading hidden"
                    id="three-reading"
                >
                    <div class="reading-head"><strong>牌阵提示</strong><span>探索方向</span></div>
                    <p>过去的直觉带你走到这里，现在拥有重新开始的工具，未来会因为持续相信自己而变得明亮。</p>
                </article>
            </section>

            <nav
                class="tabbar"
                aria-label="主导航"
            >
                <a
                    href="index.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                    <span>首页</span>
                </a>
                <a
                    href="discover.html"
                    class="tab-item active"
                    aria-current="page"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <span>发现</span>
                </a>
                <a
                    href="record.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                        />
                    </svg>
                    <span>记梦</span>
                </a>
                <a
                    href="profile.html"
                    class="tab-item"
                >
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                        />
                    </svg>
                    <span>我的</span>
                </a>
            </nav>
        </div>
        <script>
            const modes = document.querySelectorAll('[data-mode]');
            const updateReadings = () => {
                const daily = document.querySelector('#daily-mode [data-card]');
                document
                    .getElementById('daily-reading')
                    .classList.toggle('hidden', !daily.classList.contains('flipped'));
                const threeCards = [...document.querySelectorAll('#three-mode [data-card]')];
                document
                    .getElementById('three-reading')
                    .classList.toggle('hidden', !threeCards.every((item) => item.classList.contains('flipped')));
            };
            modes.forEach((button) =>
                button.addEventListener('click', () => {
                    modes.forEach((item) => {
                        item.classList.toggle('active', item === button);
                        item.setAttribute('aria-selected', item === button);
                    });
                    document.getElementById('daily-mode').classList.toggle('hidden', button.dataset.mode !== 'daily');
                    document.getElementById('three-mode').classList.toggle('hidden', button.dataset.mode !== 'three');
                    updateReadings();
                })
            );
            document.querySelectorAll('[data-card]').forEach((card) =>
                card.addEventListener('click', () => {
                    const flipped = card.classList.toggle('flipped');
                    card.setAttribute('aria-pressed', flipped);
                    updateReadings();
                })
            );
            updateReadings();
        </script>
    </body>
</html>
