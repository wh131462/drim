<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>版本历史 - 梦见</title>
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <style>
            .version-page {
                padding-bottom: 32px;
            }
            .version-page .navbar .btn-icon {
                position: absolute;
                left: 12px;
            }
            .version-intro {
                padding: 22px 20px 0;
            }
            .version-intro h1 {
                font-size: 20px;
            }
            .version-intro p {
                color: var(--text-secondary);
                font-size: 12px;
                margin-top: 6px;
            }
            .version-tools {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                margin: 18px 16px;
            }
            .version-tools .btn {
                padding: 10px 14px;
                font-size: 12px;
                text-decoration: none;
            }
            .version-card {
                margin: 16px;
                padding: 18px;
                border: 2px solid transparent;
                border-radius: var(--radius-lg);
                background: var(--card-background);
                box-shadow: var(--shadow-sm);
            }
            .version-card.current {
                border-color: var(--primary-color);
            }
            .version-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .version-badge {
                display: inline-flex;
                padding: 5px 10px;
                background: var(--primary-light);
                color: var(--primary-color);
                border-radius: 99px;
                font-size: 12px;
                font-weight: 700;
            }
            .version-badge.original {
                color: var(--success-color);
                background: rgba(72, 187, 120, 0.12);
            }
            .current-badge {
                color: var(--primary-color);
                font-size: 11px;
                font-weight: 700;
            }
            .version-content {
                margin: 14px 0;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font-size: 14px;
                line-height: 1.8;
            }
            .version-meta {
                color: var(--text-secondary);
                font-size: 11px;
            }
            .version-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding-top: 14px;
                margin-top: 14px;
                border-top: 1px solid var(--border-color);
            }
            .version-actions .btn {
                padding: 10px 8px;
                font-size: 12px;
            }
            .version-page button:disabled {
                cursor: not-allowed;
                opacity: 0.45;
                box-shadow: none;
            }
            .version-page [hidden] {
                display: none !important;
            }
            .version-page :is(button, a, summary):focus-visible {
                outline: 3px solid var(--primary-color);
                outline-offset: 3px;
            }
            .compare-panel {
                margin: 16px;
                padding: 16px;
                background: var(--card-background);
                border-radius: var(--radius-lg);
            }
            .compare-panel h2 {
                font-size: 14px;
                margin-bottom: 12px;
            }
            .compare-column + .compare-column {
                border-top: 1px solid var(--border-color);
                margin-top: 14px;
                padding-top: 14px;
            }
            .compare-column h3 {
                font-size: 12px;
                color: var(--primary-color);
            }
            .compare-column p {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                color: var(--text-secondary);
                font-size: 13px;
                line-height: 1.8;
                margin-top: 8px;
            }
            .version-status {
                margin: 16px 20px;
                color: var(--primary-color);
                font-size: 12px;
                line-height: 1.7;
            }
            .version-status:empty {
                display: none;
            }
        </style>
        <script src="prototype.js"></script>
    </head>
    <body>
        <div class="app-container version-page">
            <div class="navbar">
                <a
                    href="dream-detail.html"
                    id="versionBack"
                    class="btn-icon"
                    aria-label="返回梦境详情"
                    ><svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <path d="M19 12H5M12 19l-7-7 7-7" /></svg></a
                ><span>版本历史</span>
            </div>
            <main>
                <div class="version-intro">
                    <h1>留住最初的梦</h1>
                    <p id="versionSource">本次会话的 2 个版本，切换版本不会删除其他内容</p>
                </div>
                <div class="version-tools">
                    <button
                        id="compareButton"
                        class="btn btn-outline"
                        type="button"
                        aria-expanded="false"
                        aria-controls="comparePanel"
                    >
                        对比版本</button
                    ><a
                        id="editLink"
                        class="btn btn-primary"
                        href="record.html?edit=1"
                        >编辑当前版本</a
                    >
                </div>
                <section
                    id="comparePanel"
                    class="compare-panel"
                    aria-labelledby="compareTitle"
                    hidden
                >
                    <h2 id="compareTitle">原始版与润色示例</h2>
                    <div class="compare-column">
                        <h3>v1 原始记录</h3>
                        <p id="compareOriginal"></p>
                    </div>
                    <div class="compare-column">
                        <h3>v2 润色示例</h3>
                        <p id="comparePolished"></p>
                    </div>
                </section>
                <article
                    id="originalCard"
                    class="version-card"
                >
                    <div class="version-header">
                        <span class="version-badge original">v1 原始记录</span
                        ><span
                            id="originalCurrent"
                            class="current-badge"
                            hidden
                            >当前版本</span
                        >
                    </div>
                    <p
                        id="originalContent"
                        class="version-content"
                    ></p>
                    <p
                        id="originalMeta"
                        class="version-meta"
                    ></p>
                    <div class="version-actions">
                        <button
                            id="copyOriginal"
                            class="btn btn-outline"
                            type="button"
                        >
                            复制内容</button
                        ><button
                            id="switchOriginal"
                            class="btn btn-primary"
                            type="button"
                        >
                            切换此版本
                        </button>
                    </div>
                </article>
                <article
                    id="polishedCard"
                    class="version-card"
                >
                    <div class="version-header">
                        <span class="version-badge">v2 润色示例</span
                        ><span
                            id="polishedCurrent"
                            class="current-badge"
                            hidden
                            >当前版本</span
                        >
                    </div>
                    <p
                        id="polishedContent"
                        class="version-content"
                    ></p>
                    <p
                        id="polishedMeta"
                        class="version-meta"
                    ></p>
                    <div class="version-actions">
                        <button
                            id="copyPolished"
                            class="btn btn-outline"
                            type="button"
                        >
                            复制内容</button
                        ><button
                            id="switchPolished"
                            class="btn btn-primary"
                            type="button"
                        >
                            切换此版本
                        </button>
                    </div>
                </article>
                <p
                    id="versionStatus"
                    class="version-status"
                    role="status"
                    aria-live="polite"
                ></p>
            </main>
        </div>
        <script>
            (() => {
                const api = window.DrimDesign;
                const sample = {
                    original: '我梦见自己在一片草地上奔跑，阳光很温暖。跑着跑着，我突然能飞起来了，感觉轻松又自由。',
                    polished:
                        '我梦见自己在一片草地上奔跑，阳光落在肩上。后来我慢慢飞起来，俯瞰着安静的大地，心里感到自由又轻松。'
                };
                const isSample = new URLSearchParams(location.search).get('sample') === '1' || !api.readDream();
                const saved = api.pageDream(location.search) || api.sampleDream();
                if (isSample) {
                    document.getElementById('editLink').hidden = true;
                    document.getElementById('versionBack').href =
                        `dream-detail.html?sample=1&date=${api.shanghaiDate(saved.recordedAt)}`;
                }
                const versions = saved?.versions || {
                    original: saved?.content || sample.original,
                    polished: sample.polished
                };
                let state = {
                    content: versions.original,
                    tags: [],
                    emotion: null,
                    isPublic: false,
                    recordedAt: new Date().toISOString(),
                    ...saved,
                    versions,
                    activeVersion: saved?.activeVersion === 'polished' ? 'polished' : 'original'
                };
                const status = document.getElementById('versionStatus');
                const valid = (value) => typeof value === 'string' && value.trim().length >= 25 && value.length <= 1000;
                const names = { original: '原始记录', polished: '润色示例' };
                const ids = { original: 'Original', polished: 'Polished' };
                const render = () => {
                    for (const name of ['original', 'polished']) {
                        const text = versions[name] || '';
                        const current = state.activeVersion === name;
                        document.getElementById(`${name}Content`).textContent =
                            text || '这个版本还没有内容，可进入编辑补充。';
                        document.getElementById(`${name}Meta`).textContent =
                            `${text.length} 字${valid(text) ? '' : '，需要 25～1000 字才能切换'}`;
                        document.getElementById(`${name}Current`).hidden = !current;
                        document.getElementById(`${name}Card`).classList.toggle('current', current);
                        const button = document.getElementById(`switch${ids[name]}`);
                        button.disabled = isSample || current || !valid(text);
                        button.textContent = current ? '当前版本' : '切换此版本';
                        document.getElementById(`copy${ids[name]}`).disabled = !text;
                        document.getElementById(`compare${ids[name]}`).textContent = text || '暂无内容';
                    }
                };
                if (isSample)
                    document.getElementById('versionSource').textContent = '静态示例（原始记录和润色示例各 1 个）';
                for (const name of ['original', 'polished']) {
                    document.getElementById(`switch${ids[name]}`).addEventListener('click', () => {
                        if (isSample || !valid(versions[name])) return;
                        const next = { ...state, content: versions[name], activeVersion: name };
                        if (!api.writeDream(next)) {
                            status.textContent = '浏览器未允许临时保存，当前版本没有改变。';
                            return;
                        }
                        state = next;
                        render();
                        status.textContent = `已切换为${names[name]}，其他版本仍然保留。`;
                    });
                    document.getElementById(`copy${ids[name]}`).addEventListener('click', async () => {
                        try {
                            await navigator.clipboard.writeText(versions[name] || '');
                            status.textContent = `已复制${names[name]}。`;
                        } catch {
                            status.textContent = '当前浏览器无法复制，请长按或选中文本后手动复制。';
                        }
                    });
                }
                document.getElementById('compareButton').addEventListener('click', () => {
                    const panel = document.getElementById('comparePanel');
                    panel.hidden = !panel.hidden;
                    document.getElementById('compareButton').setAttribute('aria-expanded', String(!panel.hidden));
                    document.getElementById('compareButton').textContent = panel.hidden ? '对比版本' : '收起对比';
                });
                document.getElementById('editLink').addEventListener('click', (event) => {
                    if (isSample) {
                        event.preventDefault();
                        return;
                    }
                    if (!api.writeDream({ ...state, content: versions[state.activeVersion] || '' })) {
                        event.preventDefault();
                        status.textContent = '浏览器未允许临时保存，请在记梦页继续编辑。';
                    }
                });
                render();
            })();
        </script>
    </body>
</html>
