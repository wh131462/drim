<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>梦见 - 我的</title>
        <link
            rel="stylesheet"
            href="styles.css"
        />
        <style>
            .profile-intro {
                padding: 28px 24px 20px;
                background: linear-gradient(155deg, #eee9ff, #f8f9fd);
            }

            .profile-intro h1 {
                font-size: 28px;
                letter-spacing: -0.04em;
            }

            .profile-intro p {
                margin-top: 5px;
                color: var(--text-secondary);
                font-size: 13px;
            }

            .profile-header {
                display: flex;
                align-items: center;
                gap: 14px;
                margin: 0 16px 16px;
                padding: 20px;
                background: var(--card-background);
                border-radius: 20px;
            }

            .avatar {
                flex: 0 0 58px;
                height: 58px;
                border-radius: 50%;
                background: var(--primary-light);
                overflow: hidden;
            }

            .avatar svg {
                width: 100%;
                height: 100%;
                fill: #ad9bdf;
                transform: scale(1.1) translateY(4px);
            }

            .user-info {
                min-width: 0;
            }
            .user-name {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .user-id {
                margin-top: 4px;
                font-size: 11px;
                color: var(--text-light);
            }
            .user-points {
                margin-top: 7px;
                font-size: 12px;
                color: var(--primary-color);
            }
            .user-points strong {
                font-variant-numeric: tabular-nums;
            }

            .vip-badge {
                background: var(--vip-gradient);
                color: #ffe19a;
                font-size: 10px;
                padding: 3px 8px;
                border-radius: 8px;
                font-weight: 700;
                text-decoration: none;
            }

            .checkin-card {
                display: flex;
                align-items: center;
                gap: 14px;
                margin: 0 16px 16px;
                padding: 20px;
                background: #eee9ff;
                border-radius: 20px;
            }

            .checkin-card svg {
                flex: 0 0 32px;
                color: var(--primary-color);
            }
            .checkin-copy {
                flex: 1;
                min-width: 0;
            }
            .checkin-copy h2 {
                font-size: 15px;
            }
            .checkin-copy p {
                margin-top: 4px;
                font-size: 11px;
                color: var(--text-secondary);
            }
            .checkin-card .btn {
                flex-shrink: 0;
                padding: 10px 14px;
                font-size: 12px;
                text-decoration: none;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                margin: 0 16px 16px;
                padding: 20px 8px;
                background: var(--card-background);
                border-radius: 20px;
                text-align: center;
            }

            .stat-item + .stat-item {
                border-left: 1px solid var(--border-color);
            }
            .stat-value {
                font-size: 25px;
                font-weight: 750;
                font-variant-numeric: tabular-nums;
            }
            .stat-label {
                margin-top: 4px;
                font-size: 11px;
                color: var(--text-secondary);
            }
            .calendar-card {
                margin: 0 16px 16px;
                padding: 20px;
            }
            .calendar-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .calendar-heading h2 {
                font-size: 16px;
            }
            .month-controls {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .month-label {
                min-width: 88px;
                text-align: center;
                font-size: 12px;
                font-weight: 600;
            }
            .month-arrow {
                display: grid;
                place-items: center;
                width: 30px;
                height: 32px;
                padding: 0;
                border: 0;
                border-radius: 8px;
                background: none;
                color: var(--primary-color);
                font-size: 22px;
                cursor: pointer;
            }
            .month-arrow:hover {
                background: var(--primary-light);
            }
            .calendar-grid {
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 5px;
                text-align: center;
                margin-top: 16px;
            }
            .calendar-weekday {
                padding: 4px 0 8px;
                font-size: 11px;
                color: var(--text-light);
            }
            .calendar-day {
                display: grid;
                place-items: center;
                aspect-ratio: 1;
                border-radius: 10px;
                font-size: 12px;
                color: var(--text-secondary);
                text-decoration: none;
                position: relative;
                font-variant-numeric: tabular-nums;
            }
            .calendar-day.has-dream {
                background: #eee9ff;
                color: var(--primary-color);
                font-weight: 600;
            }
            .calendar-day.has-dream::after {
                content: '';
                position: absolute;
                bottom: 4px;
                width: 3px;
                height: 3px;
                border-radius: 50%;
                background: currentColor;
            }
            .calendar-day.today {
                outline: 1px solid var(--primary-color);
                outline-offset: -1px;
                color: var(--primary-color);
                font-weight: 700;
            }
            .calendar-day.has-dream:hover {
                background: var(--primary-color);
                color: white;
            }
            .calendar-summary {
                margin-top: 16px;
                font-size: 11px;
                color: var(--text-secondary);
            }
            .calendar-legend {
                display: flex;
                gap: 16px;
                align-items: center;
                margin-top: 8px;
                font-size: 10px;
                color: var(--text-light);
            }
            .calendar-legend span {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
            .legend-recorded {
                width: 9px;
                height: 9px;
                border-radius: 3px;
                background: #ded4ff;
            }
            .legend-today {
                width: 9px;
                height: 9px;
                border-radius: 3px;
                border: 1px solid var(--primary-color);
            }
            .menu-list {
                background: var(--card-background);
                margin: 0 16px;
                border-radius: 20px;
                overflow: hidden;
            }
            .menu-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 18px 20px;
                border-bottom: 1px solid var(--border-color);
                font-size: 14px;
                color: var(--text-main);
                text-decoration: none;
            }
            .menu-item:hover {
                background: #f5f2ff;
            }
            .menu-item:last-child {
                border-bottom: 0;
            }
            .menu-icon {
                width: 20px;
                height: 20px;
                fill: currentColor;
                opacity: 0.8;
            }
            .menu-chevron {
                width: 16px;
                height: 16px;
                fill: var(--text-light);
            }
            .profile-header a:focus-visible,
            .checkin-card a:focus-visible,
            .menu-item:focus-visible,
            .month-arrow:focus-visible,
            .calendar-day:focus-visible {
                outline: 2px solid var(--primary-color);
                outline-offset: 3px;
            }

            @media (max-width: 340px) {
                .profile-intro {
                    padding-left: 16px;
                    padding-right: 16px;
                }
                .profile-header,
                .checkin-card {
                    padding: 16px;
                    gap: 10px;
                }
                .checkin-card svg {
                    flex-basis: 26px;
                    width: 26px;
                }
                .checkin-card .btn {
                    padding: 9px 10px;
                    font-size: 11px;
                }
                .calendar-card {
                    padding: 16px 12px;
                }
                .calendar-heading h2 {
                    font-size: 15px;
                }
                .month-controls {
                    gap: 0;
                }
                .month-label {
                    min-width: 82px;
                }
                .month-arrow {
                    width: 24px;
                }
                .calendar-grid {
                    gap: 4px;
                }
            }
        </style>
        <script src="prototype.js"></script>

        <script>
            // shortcut: 历史日历是相对今天的演示记录，接入账号后替换为梦境日历接口。
            const shanghaiDate = (date = new Date()) =>
                new Intl.DateTimeFormat('en-CA', {
                    timeZone: 'Asia/Shanghai',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }).format(date);
            const todayKey = shanghaiDate();
            const [todayYear, todayMonth, todayDay] = todayKey.split('-').map(Number);
            const todayDate = new Date(Date.UTC(todayYear, todayMonth - 1, todayDay));
            const currentMonthKey = `${todayYear}-${todayMonth}`;
            const recordedDays = {};
            const addRecordedDate = (date) => {
                const key = `${date.getUTCFullYear()}-${date.getUTCMonth() + 1}`;
                if (!recordedDays[key]) recordedDays[key] = [];
                const day = date.getUTCDate();
                if (!recordedDays[key].includes(day)) recordedDays[key].push(day);
            };
            for (let offset = 1; offset <= 7; offset++) {
                const date = new Date(todayDate);
                date.setUTCDate(date.getUTCDate() - offset);
                addRecordedDate(date);
            }
            for (const day of [1, 4, 7, 10, 13, 16, 19, 21]) {
                addRecordedDate(new Date(Date.UTC(todayYear, todayMonth - 2, day)));
            }
            let recordedToday = false;
            try {
                const savedDream = JSON.parse(sessionStorage.getItem('drim-design-dream') || 'null');
                if (
                    savedDream &&
                    typeof savedDream.content === 'string' &&
                    savedDream.content.trim() &&
                    savedDream.content.length <= 1000 &&
                    typeof savedDream.recordedAt === 'string' &&
                    shanghaiDate(new Date(savedDream.recordedAt)) === todayKey
                ) {
                    recordedToday = true;
                    addRecordedDate(todayDate);
                    document.getElementById('checkin-title').textContent = '今天已经记梦';
                    document.getElementById('checkin-message').textContent = '你的梦境已收入潜意识档案';
                    document.getElementById('checkin-action').textContent = '回看梦境';
                    document.getElementById('checkin-action').href = 'dream-detail.html';
                }
            } catch (error) {
                // 原型存储不可用或数据损坏时保留静态示例。
            }
            document.getElementById('total-count').textContent = String(
                Object.values(recordedDays).reduce((total, days) => total + days.length, 0)
            );
            document.getElementById('month-count').textContent = String((recordedDays[currentMonthKey] || []).length);
            document.getElementById('streak-count').textContent = recordedToday ? '8' : '7';
            let calendarMonth = new Date(Date.UTC(todayYear, todayMonth - 1, 1));

            function renderCalendar() {
                const year = calendarMonth.getUTCFullYear();
                const month = calendarMonth.getUTCMonth();
                const title = `${year}年${month + 1}月`;
                const recorded = recordedDays[`${year}-${month + 1}`] || [];
                const grid = document.getElementById('calendar-days');
                grid.replaceChildren();
                grid.setAttribute('aria-label', `${title}梦境记录`);
                document.getElementById('calendar-month').textContent = title;
                document.getElementById('calendar-summary').textContent =
                    `${month + 1}月已记录 ${recorded.length} 天，点击标记日期回看梦境`;

                for (const weekday of ['日', '一', '二', '三', '四', '五', '六']) {
                    const label = document.createElement('span');
                    label.className = 'calendar-weekday';
                    label.textContent = weekday;
                    grid.append(label);
                }
                for (let blank = 0; blank < calendarMonth.getUTCDay(); blank++) {
                    const cell = document.createElement('span');
                    cell.setAttribute('aria-hidden', 'true');
                    grid.append(cell);
                }
                for (let day = 1; day <= new Date(Date.UTC(year, month + 1, 0)).getUTCDate(); day++) {
                    const hasDream = recorded.includes(day);
                    const today = year === todayYear && month === todayMonth - 1 && day === todayDay;
                    const cell = document.createElement(hasDream ? 'a' : 'span');
                    cell.className = `calendar-day${hasDream ? ' has-dream' : ''}${today ? ' today' : ''}`;
                    cell.textContent = day;
                    cell.setAttribute(
                        'aria-label',
                        `${month + 1}月${day}日${today ? '，今天' : ''}${hasDream ? '，查看梦境' : '，未记录'}`
                    );
                    if (hasDream) {
                        const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        cell.href =
                            today && recordedToday ? 'dream-detail.html' : `dream-detail.html?sample=1&date=${date}`;
                    }
                    if (today) cell.setAttribute('aria-current', 'date');
                    grid.append(cell);
                }
            }

            document.getElementById('previous-month').addEventListener('click', () => {
                calendarMonth.setUTCMonth(calendarMonth.getUTCMonth() - 1);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', () => {
                calendarMonth.setUTCMonth(calendarMonth.getUTCMonth() + 1);
                renderCalendar();
            });
            renderCalendar();
        </script>
    </body>
</html>
