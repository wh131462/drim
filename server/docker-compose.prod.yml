# 生产环境部署配置
# 使用方法:
# 1. 复制 .env.example 为 .env 并填入实际配置
# 2. 登录 GitHub Container Registry: docker login ghcr.io -u <username> -p <token>
# 3. 首次部署运行: ./scripts/deploy.sh setup
# 4. 后续更新运行: ./scripts/deploy.sh update

networks:
    proxy:
        external: true
    internal:
        driver: bridge

services:
    mysql:
        image: mysql:8.0
        container_name: drim-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: drim
            TZ: Asia/Shanghai
        volumes:
            - mysql_data:/var/lib/mysql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE --init-connect='SET NAMES utf8mb4' --innodb-buffer-pool-size=256M --innodb-log-buffer-size=8M --innodb-flush-method=O_DIRECT --key-buffer-size=16M --max-connections=50 --table-open-cache=128 --thread-cache-size=8 --tmp-table-size=32M --max-heap-table-size=32M --performance-schema=OFF --skip-log-bin
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - internal
        deploy:
            resources:
                limits:
                    memory: 512M

    api:
        # 从 GitHub Container Registry 拉取镜像
        image: ghcr.io/${GITHUB_REPOSITORY:-wh131462/drim}-api:latest
        container_name: drim-api
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3333
            BASE_URL: ${BASE_URL:-https://api.131462.cloud}
            DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/drim
            JWT_SECRET: ${JWT_SECRET}
            WECHAT_APPID: ${WECHAT_APPID}
            WECHAT_SECRET: ${WECHAT_SECRET}
            WECHAT_REMINDER_TEMPLATE_ID: ${WECHAT_REMINDER_TEMPLATE_ID:-}
            AI_API_KEY: ${AI_API_KEY}
            AI_API_URL: ${AI_API_URL}
            AI_MODEL: ${AI_MODEL}
            AI_API_FORMAT: ${AI_API_FORMAT:-openai}
        volumes:
            - uploads_data:/app/uploads
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - proxy
            - internal
        labels:
            - traefik.enable=true
            - traefik.http.routers.drim-api.rule=Host(`${API_DOMAIN:-api.131462.cloud}`)
            - traefik.http.routers.drim-api.entrypoints=websecure
            - traefik.http.routers.drim-api.tls.certresolver=letsencrypt
            - traefik.http.services.drim-api.loadbalancer.server.port=3333
        deploy:
            resources:
                limits:
                    memory: 384M

volumes:
    mysql_data:
    uploads_data:
